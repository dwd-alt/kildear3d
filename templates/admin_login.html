<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель | Kildear3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a1928, #030c17);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(20, 35, 55, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #ffb34760;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 3rem; color: #FFB347; }
        .logo h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #FF9833);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }
        h3 { color: #FFE5B4; text-align: center; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 28px;
            border: 1.5px solid #3a5670;
            background: #0f1e2c;
            color: #fff3e0;
            font-size: 16px;
        }
        input:focus { border-color: #FFB347; outline: none; }
        button {
            width: 100%;
            background: linear-gradient(95deg, #F6A800, #FF8C42);
            border: none;
            color: #1e2a2f;
            font-weight: 800;
            padding: 14px;
            border-radius: 44px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        button:hover { transform: translateY(-2px); }
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(220,38,38,0.1);
            border-radius: 12px;
        }
        .footer { text-align: center; margin-top: 30px; color: #94a3b8; font-size: 0.8rem; }
        .footer a { color: #FFB347; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-cube"></i>
            <h2>Kildear3D</h2>
        </div>
        <h3>🔐 Вход в админ-панель</h3>
        <form method="POST">
            <input type="text" name="username" placeholder="Логин" required autofocus>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        {% if error %}
            <div class="error"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div>
        {% endif %}
        <div class="footer"><a href="/">← Вернуться на сайт</a></div>
    </div>
</body>
</html>
