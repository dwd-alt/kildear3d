<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Kildear3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #eef4ff; }
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #0f172a 0%, #0a0f1a 100%);
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            border-right: 1px solid #ffb34740;
        }
        .sidebar h3 { color: #FFD966; margin-bottom: 40px; display: flex; align-items: center; gap: 12px; }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background: #ffb34720; color: #FFB347; }
        .logout-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #dc2626;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .main-content { margin-left: 260px; padding: 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #ffb34730;
        }
        .stat-card .value { font-size: 2rem; font-weight: 800; color: #FFD966; }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn-add {
            background: #22c55e;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #FFB347; }
        .status-select {
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            background: #334155;
            color: white;
            cursor: pointer;
        }
        .btn-icon {
            background: #FFB347;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 3px;
        }
        .btn-danger { background: #dc2626; color: white; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #FFB347;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #ffb347;
            background: #0f172a;
            color: white;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 12px;
            border-left: 4px solid #22c55e;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 20px 10px; }
            .sidebar h3 span, .sidebar nav a span { display: none; }
            .main-content { margin-left: 70px; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="fas fa-cube"></i><span>Kildear3D</span></h3>
        <nav>
            <a href="#" onclick="showTab('orders')" class="active" id="tab-orders-btn">
                <i class="fas fa-shopping-cart"></i><span>Заказы</span>
            </a>
            <a href="#" onclick="showTab('plastics')" id="tab-plastics-btn">
                <i class="fas fa-palette"></i><span>Пластики</span>
            </a>
        </nav>
        <a href="/admin/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
    </div>

    <div class="main-content">
        <div class="stats-grid" id="stats"></div>

        <div id="tab-orders" class="tab-pane active">
            <div class="card">
                <div class="card-header"><h2><i class="fas fa-shopping-cart"></i> Заказы</h2></div>
                <div style="overflow-x: auto;">
                    <table><thead><tr><th>ID</th><th>Модель</th><th>Клиент</th><th>Контакты</th><th>Пластик</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead>
                    <tbody id="orders-list"></tbody></table>
                </div>
            </div>
        </div>

        <div id="tab-plastics" class="tab-pane">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-palette"></i> Пластики</h2>
                    <button class="btn-add" onclick="openPlasticModal()"><i class="fas fa-plus"></i> Добавить</button>
                </div>
                <div style="overflow-x: auto;">
                    <table><thead><tr><th>ID</th><th>Название</th><th>Цвет</th><th>Цена/гр</th><th>Наличие</th><th>Действия</th></tr></thead>
                    <tbody id="plastics-list"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div id="plasticModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить пластик</h3>
            <input type="hidden" id="plastic_id">
            <input type="text" id="plastic_name" placeholder="Название (PLA, ABS...)" required>
            <input type="text" id="plastic_color" placeholder="Цвет" required>
            <input type="text" id="plastic_color_code" placeholder="HEX код">
            <input type="number" id="plastic_price" step="0.1" placeholder="Цена за грамм" required>
            <select id="plastic_stock"><option value="true">В наличии</option><option value="false">Нет в наличии</option></select>
            <div class="modal-buttons">
                <button class="btn-add" onclick="savePlastic()">Сохранить</button>
                <button onclick="closePlasticModal()" style="background:#334155;">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg, isError) { let t=document.createElement('div'); t.className='toast'; t.style.borderLeftColor=isError?'#ef4444':'#22c55e'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        async function loadStats(){ let r=await fetch('/api/admin/stats'), d=await r.json(); document.getElementById('stats').innerHTML=`<div class="stat-card"><div class="value">${d.total_orders||0}</div><div>Всего заказов</div></div><div class="stat-card"><div class="value">${d.new_orders||0}</div><div>Новых</div></div><div class="stat-card"><div class="value">${d.in_progress_orders||0}</div><div>В работе</div></div><div class="stat-card"><div class="value">${d.completed_orders||0}</div><div>Завершено</div></div><div class="stat-card"><div class="value">${d.total_plastics||0}</div><div>Пластиков</div></div>`; }
        async function loadOrders(){ let r=await fetch('/api/admin/orders'), o=await r.json(); document.getElementById('orders-list').innerHTML=o.map(o=>`<tr><td>${o.id}</td><td>${escapeHtml(o.model_name)}</td><td>${escapeHtml(o.customer_name)}</td><td>${escapeHtml(o.contact_info)}</td><td>${escapeHtml(o.plastic)}</td><td><select class="status-select" onchange="updateStatus(${o.id},this.value)"><option value="new" ${o.status=='new'?'selected':''}>🆕 Новый</option><option value="in_progress" ${o.status=='in_progress'?'selected':''}>⚙️ В работе</option><option value="completed" ${o.status=='completed'?'selected':''}>✅ Завершен</option><option value="cancelled" ${o.status=='cancelled'?'selected':''}>❌ Отменен</option></select></td><td>${new Date(o.created_at).toLocaleDateString()}</td><td><button class="btn-icon btn-danger" onclick="deleteOrder(${o.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center">Нет заказов</td></tr>'; }
        async function loadPlastics(){ let r=await fetch('/api/admin/plastics'), p=await r.json(); document.getElementById('plastics-list').innerHTML=p.map(p=>`<tr><td>${p.id}</td><td>${escapeHtml(p.name)}</td><td><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${p.color_code||'#ccc'};margin-right:8px;"></span>${escapeHtml(p.color)}</td><td>${p.price_per_gram} ₽</td><td>${p.in_stock?'✅ Да':'❌ Нет'}</td><td><button class="btn-icon" onclick="editPlastic(${p.id})"><i class="fas fa-edit"></i></button><button class="btn-icon btn-danger" onclick="deletePlastic(${p.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center">Нет пластиков</td></tr>'; }
        async function updateStatus(id,s){ await fetch(`/api/admin/orders/${id}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})}); showToast('Статус обновлен'); loadStats(); }
        async function deleteOrder(id){ if(confirm('Удалить заказ?')){ await fetch(`/api/admin/orders/${id}`,{method:'DELETE'}); showToast('Заказ удален'); loadOrders(); loadStats(); } }
        function openPlasticModal(p=null){ let m=document.getElementById('plasticModal'); if(p){ document.getElementById('modalTitle').innerText='Редактировать пластик'; document.getElementById('plastic_id').value=p.id; document.getElementById('plastic_name').value=p.name; document.getElementById('plastic_color').value=p.color; document.getElementById('plastic_color_code').value=p.color_code||''; document.getElementById('plastic_price').value=p.price_per_gram; document.getElementById('plastic_stock').value=p.in_stock; } else { document.getElementById('modalTitle').innerText='Добавить пластик'; document.getElementById('plastic_id').value=''; document.getElementById('plastic_name').value=''; document.getElementById('plastic_color').value=''; document.getElementById('plastic_color_code').value=''; document.getElementById('plastic_price').value=''; document.getElementById('plastic_stock').value='true'; } m.style.display='flex'; }
        function closePlasticModal(){ document.getElementById('plasticModal').style.display='none'; }
        async function savePlastic(){ let id=document.getElementById('plastic_id').value, data={name:document.getElementById('plastic_name').value,color:document.getElementById('plastic_color').value,color_code:document.getElementById('plastic_color_code').value,price_per_gram:parseFloat(document.getElementById('plastic_price').value),in_stock:document.getElementById('plastic_stock').value==='true'}, url=id?`/api/admin/plastics/${id}`:'/api/admin/plastics', method=id?'PUT':'POST', r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(r.ok){ showToast(id?'Пластик обновлен':'Пластик добавлен'); closePlasticModal(); loadPlastics(); loadStats(); } }
        async function editPlastic(id){ let r=await fetch('/api/admin/plastics'), p=await r.json(), plastic=p.find(p=>p.id===id); if(plastic) openPlasticModal(plastic); }
        async function deletePlastic(id){ if(confirm('Удалить пластик?')){ await fetch(`/api/admin/plastics/${id}`,{method:'DELETE'}); showToast('Пластик удален'); loadPlastics(); loadStats(); } }
        function showTab(tab){ document.getElementById('tab-orders').classList.toggle('active',tab==='orders'); document.getElementById('tab-plastics').classList.toggle('active',tab==='plastics'); if(tab==='orders') loadOrders(); if(tab==='plastics') loadPlastics(); }
        function escapeHtml(t){ if(!t) return ''; let d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        window.onclick=e=>{ if(e.target===document.getElementById('plasticModal')) closePlasticModal(); }
        loadStats(); loadOrders(); setInterval(()=>{ loadStats(); if(document.getElementById('tab-orders').classList.contains('active')) loadOrders(); },30000);
    </script>
</body>
</html>
