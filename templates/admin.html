<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Kildear3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }
        .sidebar {
            width: 250px;
            background: #0f172a;
            position: fixed;
            height: 100vh;
            padding: 20px;
            border-right: 1px solid #ffb347;
        }
        .sidebar h2 { color: #FFD966; margin-bottom: 20px; }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .sidebar a:hover { background: #ffb34720; }
        .logout { color: #ff6b6b; margin-top: 50px; }
        .main { margin-left: 250px; padding: 20px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ffb34730;
        }
        .stat .num { font-size: 2em; color: #FFD966; font-weight: bold; }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #FFB347; }
        select, button {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .delete { background: #dc2626; color: white; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 5px;
            border-left: 4px solid #22c55e;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Kildear3D</h2>
        <a href="#" onclick="loadOrders()">📦 Заказы</a>
        <a href="/admin/logout" class="logout">🚪 Выйти</a>
    </div>
    <div class="main">
        <div class="stats" id="stats"></div>
        
        <div class="card">
            <h2>📦 Список заказов</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Модель</th><th>Клиент</th><th>Контакты</th><th>Описание</th><th>Статус</th><th>Дата</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="ordersList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function loadStats() {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            document.getElementById('stats').innerHTML = `
                <div class="stat"><div class="num">${data.total_orders}</div><div>Всего заказов</div></div>
                <div class="stat"><div class="num">${data.new_orders}</div><div>Новых</div></div>
                <div class="stat"><div class="num">${data.in_progress_orders}</div><div>В работе</div></div>
            `;
        }

        async function loadOrders() {
            const res = await fetch('/api/admin/orders');
            const orders = await res.json();
            document.getElementById('ordersList').innerHTML = orders.map(o => `
                <tr>
                    <td>${o.id}</td>
                    <td><strong>${escapeHtml(o.model_name)}</strong></td>
                    <td>${escapeHtml(o.customer_name)}</td>
                    <td>${escapeHtml(o.contact_info)}</td>
                    <td><small>${escapeHtml(o.description || '-')}</small></td>
                    <td>
                        <select onchange="updateStatus(${o.id}, this.value)">
                            <option value="new" ${o.status=='new' ? 'selected' : ''}>🆕 Новый</option>
                            <option value="in_progress" ${o.status=='in_progress' ? 'selected' : ''}>⚙️ В работе</option>
                            <option value="completed" ${o.status=='completed' ? 'selected' : ''}>✅ Завершен</option>
                            <option value="cancelled" ${o.status=='cancelled' ? 'selected' : ''}>❌ Отменен</option>
                        </select>
                    </td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td><button class="delete" onclick="deleteOrder(${o.id})">🗑️ Удалить</button></td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, status) {
            await fetch(`/api/admin/orders/${id}/status`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status})
            });
            showToast('Статус обновлен');
            loadStats();
        }

        async function deleteOrder(id) {
            if(confirm('Удалить заказ?')) {
                await fetch(`/api/admin/orders/${id}`, {method: 'DELETE'});
                showToast('Заказ удален');
                loadOrders();
                loadStats();
            }
        }

        function escapeHtml(text) {
            if(!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadStats();
        loadOrders();
        setInterval(() => { loadStats(); loadOrders(); }, 30000);
    </script>
</body>
</html>
